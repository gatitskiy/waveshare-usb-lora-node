services:
  nats:
    image: nats:2-alpine
    container_name: nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-m", "8222"]

  ws-ntfy:
    build: .
    image: waveshare-usb-lora-node:latest
    container_name: ws-ntfy
    restart: unless-stopped
    depends_on:
      - nats
    volumes:
      - ./config:/config:ro
    command: ["ws-ntfy", "-c", "/config/ntfy.yaml", "-l", "${LOG_LEVEL:-info}"]
