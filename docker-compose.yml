services:
  nats:
    image: nats:2-alpine
    container_name: nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-m", "8222"]

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: ["serve"]
    environment:
      - TZ=UTC
      - NTFY_BEHIND_PROXY=false
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
    volumes:
      - ./ntfy-data:/var/cache/ntfy
    ports:
      - "8089:80"

  ws-node:
    build: .
    image: waveshare-usb-lora-node:latest
    container_name: ws-node
    restart: unless-stopped
    depends_on:
      - nats
    devices:
      - "${WS_NODE_SERIAL:-/dev/ttyACM0}:/dev/ttyACM0"
    volumes:
      - ./config:/config:ro
    command:
      ["ws-node", "-c", "/config/node.yaml", "-p", "/dev/ttyACM0",
       "-l", "${LOG_LEVEL:-info}"]

  ws-ntfy:
    build: .
    image: waveshare-usb-lora-node:latest
    container_name: ws-ntfy
    restart: unless-stopped
    depends_on:
      - nats
      - ntfy
      - ws-node
    volumes:
      - ./config:/config:ro
      - ./ws-ntfy-data:/data
    command:
      ["ws-ntfy", "-c", "/config/ntfy.yaml", "-l", "${LOG_LEVEL:-info}"]
