services:
  nats:
    image: nats:2-alpine
    container_name: nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-m", "8222"]

  ws-node:
    build: .
    image: waveshare-usb-lora-node:latest
    container_name: ws-node
    restart: unless-stopped
    depends_on:
      - nats
    devices:
      - "${WS_NODE_SERIAL:-/dev/ttyACM0}:/dev/ttyACM0"
    volumes:
      - ./config:/config:ro
    command:
      ["ws-node", "-c", "/config/node.linux.yaml", "-p", "/dev/ttyACM0",
       "-l", "${LOG_LEVEL:-info}"]

  ws-ntfy:
    image: waveshare-usb-lora-node:latest
    container_name: ws-ntfy
    restart: unless-stopped
    depends_on:
      - nats
      - ws-node
    volumes:
      - ./config:/config:ro
    command:
      ["ws-ntfy", "-c", "/config/ntfy.yaml", "-l", "${LOG_LEVEL:-info}"]
